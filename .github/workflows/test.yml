name: Offline compatibility

on:
  push:
    paths-ignore: ['README.md', 'VALIDATION.md', 'RELEASE_NOTES.md', '.github/release-request.json', 'assets/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python carrier_switch.py doctor
      - run: python -m unittest -q
      - run: python build_cli.py
      - run: git diff --exit-code -- dist/
      - run: python dist/LightSpeedSwap.pyz --version

  setup-intel:
    name: Intel zipapp setup (${{ matrix.os }}, Python 3.14)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          architecture: x64
      - run: python .github/scripts/test_intel_setup.py
