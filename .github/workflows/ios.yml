name: Native iOS reader
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test measurement interpretation
        run: swift test --package-path ios
      - name: Build iPhone simulator app
        run: xcodebuild -project ios/LightSpeedRadio.xcodeproj -scheme LightSpeedRadio -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned device app
        run: xcodebuild -project ios/LightSpeedRadio.xcodeproj -scheme LightSpeedRadio -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for personal signing
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/LightSpeedRadio.app build/package/Payload/
          cd build/package
          zip -qry ../LightSpeedRadio-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LightSpeedRadio-unsigned-device-app
          path: build/LightSpeedRadio-unsigned.ipa
          retention-days: 14
